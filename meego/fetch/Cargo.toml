[package]
name = "passviewer-fetch"
version = "0.1.0"
edition = "2021"
description = "Fetches a pass update over HTTPS for the MeeGo edition of Pass Viewer"
license = "MIT"

[dependencies]
# The reason this helper exists: Harmattan's Qt 4 sits on OpenSSL 0.9.8 and
# cannot talk to a pass server of today. rustls speaks TLS 1.2 and 1.3 by
# itself, and webpki-roots brings the root certificates along -- the
# device's own store is from 2011.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "gzip"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
